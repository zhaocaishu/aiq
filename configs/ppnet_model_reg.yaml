market: &market 000906.SH
data_handler:
  class: MarketAlpha158
  module_path: aiq.dataset.handler
  kwargs:
    instruments: *market
    start_time: "2016-01-01"
    end_time: "2023-12-31"
    fit_start_time: "2017-01-01"
    fit_end_time: "2022-06-20"
    market_names: ["000300.SH", "000905.SH", "000906.SH"]
    processors:
      - class: CSWinsorize
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
          exclude_cols: ["IND_CLS_L1", "IND_CLS_L2"]
      - class: CSNeutralize
        module_path: aiq.dataset.processor
        kwargs:
          industry_col: "IND_CLS_L1"
          cap_col: "FUND_CAP"
          factor_cols:
            - "FUND_EP"
            - "FUND_BP"
            - "FUND_SP"
            - "CS_STD(?:5|10|20|30|60)$"
            - "CS_VSTD(?:5|10|20|30|60)$"
            - "CS_VMA(?:5|10|20|30|60)$"
            - "CS_WVMA(?:5|10|20|30|60)$"
            - "CS_TURN_(?:MA|STD)(?:5|10|20|30|60)$"
            - "CS_MFD_INFLOW_VOL_RATIO"
            - "CS_MFD_LARGE_AMT_RATIO"
      - class: Dropna
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "label"
    market_processors:
      - class: RobustZScoreNorm
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
          clip_outlier: true
      - class: Fillna
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
dataset:
  class: MultiscaleTSDataset
  module_path: aiq.dataset.dataset
  kwargs:
    universe: *market
    segments:
      train: ["2017-01-01", "2022-06-20"]
      valid: ["2022-07-01", "2022-12-20"]
      test: ["2023-01-01", "2023-06-30"]
    seq_len: 20
    minute_seq_len: 5
    label_names: ["RET_5D"]
    use_augmentation: false
model:
  class: PPNetModel
  module_path: aiq.models.ppnet
  kwargs:
    d_ts_feat: 6
    d_cs_feat: 139
    d_fund_feat: 4
    d_mkt_feat: 63
    d_emb: 16
    d_model: 256
    t_nhead: 4
    s_nhead: 2
    dropout: 0.5
    beta: 3.0
    epochs: 100
    batch_size: 1
    warmup_steps: 500
    learning_rate: 2e-5
    criterion_name: "Hybrid"
    early_stopping_patience: 10
evaluator:
  class: Evaluator
  module_path: aiq.evaluation.evaluator
  kwargs:
    start_time: "2023-01-01"
    end_time: "2023-06-30"
    benchmark: "000906.SH"
    pred_col: "PRED_RET_5D"
    label_col: "RET_5D"
    top_k: 30
