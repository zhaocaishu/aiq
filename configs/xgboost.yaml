market: &market 000906.SH
data_handler:
  class: Alpha158
  module_path: aiq.dataset.handler
  kwargs:
    instruments: *market
    start_time: "2015-07-01"
    end_time: "2024-06-30"
    fit_start_time: "2016-01-01"
    fit_end_time: "2021-12-21"
    label_price: "vwap"
    use_hf_features: true
    processors:
      - class: CSWinsorize
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
          exclude_cols:
            - "IND_CLS_L1"
            - "IND_CLS_L2"
            - "FUND_CAP"
      - class: CSNeutralize
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
          industry_col: "IND_CLS_L1"
          cap_col: "FUND_CAP"
          factor_cols:
            - "CS_STD(?:5|10|20|30|60)$"
            - "CS_TURN_(?:MA|STD)(?:5|10|20|30|60)$"
            - "CS_TURN_RATE$"
            - "CS_RET_STD20$"
            - "CS_HF_(?:RV|UP_VAR|DOWN_VAR)$"
dataset:
  class: CSDataset
  module_path: aiq.dataset.dataset
  kwargs:
    universe: *market
    seq_len: 20
    segments:
      train: ["2016-01-01", "2021-12-21"]
      valid: ["2022-01-01", "2022-12-21"]
      test: ["2023-01-01", "2023-12-31"]
    label_names: ["RET_5D"]
model:
  class: XGBModel
  module_path: aiq.models.xgboost
  kwargs:
    objective: "reg:squarederror"
    eval_metric: "rmse"
    tree_method: "hist"
    eta: 0.05
    max_depth: 5
    min_child_weight: 100
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 10
    nthread: 4
    seed: 1234
evaluator:
  class: Evaluator
  module_path: aiq.evaluation.evaluator
  kwargs:
    start_time: "2023-01-01"
    end_time: "2023-12-31"
    benchmark: "000906.SH"
    pred_col: "PRED_RET_5D"
    label_col: "RET_5D"
    top_k: 30
