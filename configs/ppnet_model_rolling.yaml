market: &market 000906.SH
data_handler:
  class: MarketAlpha158
  module_path: aiq.dataset.handler
  kwargs:
    instruments: *market
    start_time: "2016-07-01"
    end_time: "2024-06-30"
    market_names: ["000300.SH", "000905.SH", "000852.SH"]
    label_price: "vwap"
    use_hf_features: true
    processors:
      - class: CSWinsorize
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
          exclude_cols:
            - "IND_CLS_L1"
            - "IND_CLS_L2"
            - "FUND_CAP"
      - class: CSNeutralize
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
          industry_col: "IND_CLS_L1"
          cap_col: "FUND_CAP"
          factor_cols:
            - "CS_STD(?:5|10|20|30|60)$"
            - "CS_TURN_(?:MA|STD)(?:5|10|20|30|60)$"
            - "^CS_TURN_RATE$"
            - "^CS_RET_STD20$"
            - "^CS_HF_(?:RV|UP_VAR|DOWN_VAR)$"
      - class: RobustZScoreNorm
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
          clip_outlier: true
          include_cols:
            - "^TS_RET_1D$"
            - "^TS_GAP$"
            - "^TS_AMT_MA20_RATIO$"
            - "^TS_TURN_RATE$"
            - "^TS_HF_TAIL_RET$"
      - class: CSWinsorize
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "label"
    market_processors:
      - class: RobustZScoreNorm
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
          clip_outlier: true
      - class: Fillna
        module_path: aiq.dataset.processor
        kwargs:
          fields_group: "feature"
dataset:
  class: TSDataset
  module_path: aiq.dataset.dataset
  kwargs:
    universe: *market
    segments:
      test: ["2023-01-01", "2023-12-31"]
    seq_len: 20
    label_names: ["RET_5D"]
    use_augmentation: false
model:
  class: PPNetModel
  module_path: aiq.models.ppnet
  kwargs:
    d_ts_feat: 9
    d_cs_feat: 171
    d_fund_feat: 4
    d_mkt_feat: 63
    d_emb: 16
    d_model: 256
    t_nhead: 4
    s_nhead: 2
    dropout: 0.5
    beta: 3.0
    num_labels: 1
    # All three seeds in train-20261114.log peaked at epoch 9.
    epochs: 9
    batch_size: 1
    train_stride: 5
    sampler_seed: 42
    warmup_steps: 500
    # Preserve the near-constant learning rate before the logged best step.
    lr_scheduler_type: "constant_with_warmup"
    learning_rate: 2e-5
    criterion_name: "Hybrid"
evaluator:
  class: Evaluator
  module_path: aiq.evaluation.evaluator
  kwargs:
    start_time: "2023-01-01"
    end_time: "2023-12-31"
    benchmark: "000906.SH"
    pred_col: "PRED_RET_5D"
    label_col: "RET_5D"
    top_k: 30
